name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify tag and build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Validate annotated tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"
      - name: Resolve reproducible build metadata
        id: release-metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'PGDRILL_COMMIT=%s\n' "$(git rev-parse HEAD)"
            printf 'PGDRILL_DATE=%s\n' "$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_ENV"
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'date=%s\n' "$(git show -s --format=%cI HEAD)"
            printf 'epoch=%s\n' "$(git show -s --format=%ct HEAD)"
            printf 'version-name=%s\n' "${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"
      - name: Run release-grade checks
        run: >-
          make -s release-check
          VERSION="$GITHUB_REF_NAME"
          RELEASE_COMMIT="$PGDRILL_COMMIT"
          RELEASE_DATE="$PGDRILL_DATE"
      - name: Extract changelog release notes
        run: make -s release-notes VERSION="$GITHUB_REF_NAME"
      - name: Verify checksums and native archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          (
            cd dist
            sha256sum -c "pgdrill_${version}_checksums.txt"
          )
          mkdir -p dist/verify
          tar -xzf "dist/pgdrill_${version}_linux_amd64.tar.gz" -C dist/verify
          "dist/verify/pgdrill_${version}_linux_amd64/pgdrill" version |
            grep -F "pgdrill $GITHUB_REF_NAME ($PGDRILL_COMMIT,"
      - name: Set up OCI verification Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify release OCI layout
        run: >-
          make -s container-check
          VERSION="$GITHUB_REF_NAME"
          RELEASE_COMMIT="$PGDRILL_COMMIT"
          RELEASE_DATE="$PGDRILL_DATE"
          RELEASE_EPOCH="${{ steps.release-metadata.outputs.epoch }}"
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.49.0
      - name: Generate release SPDX SBOM
        shell: bash
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          VERSION_NAME: ${{ steps.release-metadata.outputs.version-name }}
        run: |
          set -euo pipefail
          root="dist/sbom-root"
          mkdir -p "$root"
          for archive in dist/pgdrill_"${VERSION_NAME}"_*.tar.gz; do
            tar -xzf "$archive" -C "$root"
          done
          "$SYFT" scan "dir:$root" \
            --source-name pgdrill-release \
            --source-version "$GITHUB_REF_NAME" \
            --source-supplier r314tive \
            -o "spdx-json=dist/pgdrill_${VERSION_NAME}_sbom.spdx.json"
          jq -e --arg version "$GITHUB_REF_NAME" '
            .spdxVersion == "SPDX-2.3" and
            (.packages | type == "array") and
            (.packages | length > 0) and
            any(
              .packages[];
              .name == "pgdrill-release" and
              .versionInfo == $version and
              .supplier == "Organization: r314tive"
            )
          ' "dist/pgdrill_${VERSION_NAME}_sbom.spdx.json" >/dev/null
          rm -rf "$root"
      - name: Attest release SBOM
        id: sbom-attestation
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-checksums: dist/pgdrill_${{ steps.release-metadata.outputs.version-name }}_checksums.txt
          sbom-path: dist/pgdrill_${{ steps.release-metadata.outputs.version-name }}_sbom.spdx.json
      - name: Retain release SBOM attestation
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.sbom-attestation.outputs.bundle-path }}
          VERSION_NAME: ${{ steps.release-metadata.outputs.version-name }}
        run: >-
          cp "$BUNDLE_PATH"
          "dist/pgdrill_${VERSION_NAME}_sbom-attestation.sigstore.json"
      - name: Attest release bundle provenance
        id: release-provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt
            dist/*_sbom.spdx.json
      - name: Retain release provenance
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.release-provenance.outputs.bundle-path }}
          VERSION_NAME: ${{ steps.release-metadata.outputs.version-name }}
        run: >-
          cp "$BUNDLE_PATH"
          "dist/pgdrill_${VERSION_NAME}_provenance.sigstore.json"
      - name: Verify retained release attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.release-metadata.outputs.version-name }}
        run: |
          set -euo pipefail
          signer="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for archive in dist/pgdrill_"${VERSION_NAME}"_*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "dist/pgdrill_${VERSION_NAME}_provenance.sigstore.json" \
              --signer-workflow "$signer" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$PGDRILL_COMMIT" \
              --deny-self-hosted-runners >/dev/null
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "dist/pgdrill_${VERSION_NAME}_sbom-attestation.sigstore.json" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --signer-workflow "$signer" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$PGDRILL_COMMIT" \
              --deny-self-hosted-runners >/dev/null
          done
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pgdrill-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*_checksums.txt
            dist/*_sbom.spdx.json
            dist/*.sigstore.json
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  image:
    name: Publish and verify OCI image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      SBOM_GENERATOR: docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pgdrill-${{ github.ref_name }}
          path: dist
      - name: Revalidate tag and release archives
        id: image-metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"
          version_name="${GITHUB_REF_NAME#v}"
          (
            cd dist
            sha256sum -c "pgdrill_${version_name}_checksums.txt"
          )
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'date=%s\n' "$(git show -s --format=%cI HEAD)"
            printf 'epoch=%s\n' "$(git show -s --format=%ct HEAD)"
            printf 'version-name=%s\n' "$version_name"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ARCHIVE_VERSION=${{ steps.image-metadata.outputs.version-name }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.image-metadata.outputs.commit }}
            CREATED=${{ steps.image-metadata.outputs.date }}
            SOURCE_DATE_EPOCH=${{ steps.image-metadata.outputs.epoch }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          pull: true
          push: true
          provenance: mode=max
          attests: type=sbom,generator=${{ env.SBOM_GENERATOR }}
      - name: Attest image provenance
        id: image-provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Retain and verify image identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.image-provenance.outputs.bundle-path }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION_NAME: ${{ steps.image-metadata.outputs.version-name }}
          COMMIT: ${{ steps.image-metadata.outputs.commit }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          bundle="dist/pgdrill_${VERSION_NAME}_image-provenance.sigstore.json"
          cp "$BUNDLE_PATH" "$bundle"
          docker buildx imagetools inspect "$image@$IMAGE_DIGEST" \
            --format '{{json .Manifest}}' > \
            "dist/pgdrill_${VERSION_NAME}_image-manifest.json"
          jq -e '
            [
              .manifests[]
              | select(
                  .platform.os == "linux" and
                  (
                    .platform.architecture == "amd64" or
                    .platform.architecture == "arm64"
                  )
                )
              | "\(.platform.os)/\(.platform.architecture)"
            ]
            | sort == ["linux/amd64", "linux/arm64"]
          ' "dist/pgdrill_${VERSION_NAME}_image-manifest.json" >/dev/null
          docker run --rm --platform linux/amd64 \
            "$image@$IMAGE_DIGEST" version |
            grep -F "pgdrill $GITHUB_REF_NAME ($COMMIT,"
          gh attestation verify "oci://$image@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$COMMIT" \
            --deny-self-hosted-runners >/dev/null
          docker logout "$REGISTRY"
          source_config="${DOCKER_CONFIG:-$HOME/.docker}"
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          if [[ -d "$source_config/cli-plugins" ]]; then
            ln -s "$source_config/cli-plugins" "$anonymous_config/cli-plugins"
          fi
          DOCKER_CONFIG="$anonymous_config" \
            docker buildx imagetools inspect "$image@$IMAGE_DIGEST" >/dev/null
          {
            printf 'image=%s\n' "$image"
            printf 'tag=%s\n' "$GITHUB_REF_NAME"
            printf 'digest=%s\n' "$IMAGE_DIGEST"
            printf 'platforms=linux/amd64,linux/arm64\n'
            printf 'source_commit=%s\n' "$COMMIT"
            printf 'runtime_base=%s\n' \
              'docker.io/library/debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818'
          } > "dist/pgdrill_${VERSION_NAME}_image.txt"
      - name: Upload verified image metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pgdrill-${{ github.ref_name }}-image
          path: |
            dist/*_image.txt
            dist/*_image-manifest.json
            dist/*_image-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - build
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pgdrill-${{ github.ref_name }}
          path: dist
      - name: Download verified image metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pgdrill-${{ github.ref_name }}-image
          path: dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(
            dist/*.tar.gz
            dist/*_checksums.txt
            dist/*_sbom.spdx.json
            dist/*.sigstore.json
            dist/*_image.txt
            dist/*_image-manifest.json
          )
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --fail-on-no-commits \
            --title "pgdrill $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            "${release_flags[@]}"
