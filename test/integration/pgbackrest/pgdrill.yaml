cluster:
  name: integration-pgbackrest-postgresql

provider:
  type: pgbackrest
  binary: /usr/bin/pgbackrest
  config_path: /opt/pgdrill/test/pgbackrest.conf
  stanza: integration
  env:
    PGBACKREST_CONFIG: /opt/pgdrill/test/pgbackrest.conf
  timeout: 5m
  pgbackrest_check:
    enabled: true
    timeout: 5m
    archive_timeout: 1m
  pgbackrest_verify:
    enabled: true
    timeout: 5m
    output: text

target:
  type: local
  work_dir: /validation/work/restore
  postgres_binary: postgres
  postgres_port: 55434
  startup_timeout: 30s
  shutdown_timeout: 30s
  remove_work_dir: true

restore:
  timeout: 10m
  verify_backup:
    enabled: false

recovery:
  target: latest

policy:
  maximum_rto: 5m
  maximum_rpo: 10m
  maximum_backup_age: 10m
  require_recovery_target: true
  require_cleanup: true

probes:
  - type: pg_isready
    binary: pg_isready
    timeout: 30s
  - type: sql
    name: post_backup_wal_replayed
    binary: psql
    query: "select 1 / case when count(*) = 101 and bool_or(payload = 'post-backup-wal-sentinel') then 1 else 0 end from public.pgdrill_integration_probe"
    timeout: 30s
  - type: amcheck
    name: structural_amcheck
    binary: pg_amcheck
    mode: database
    args:
      on_error_stop: "true"
    timeout: 2m
  - type: pg_dump
    name: schema_dump
    binary: pg_dump
    mode: schema
    timeout: 2m

report:
  format: json
  path: /output/report.json
