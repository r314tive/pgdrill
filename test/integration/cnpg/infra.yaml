apiVersion: v1
kind: Namespace
metadata:
  name: pgdrill-cnpg
---
apiVersion: v1
kind: Secret
metadata:
  name: minio
  namespace: pgdrill-cnpg
  labels:
    pgdrill.io/test-only: "true"
type: Opaque
stringData:
  ACCESS_KEY_ID: pgdrill-local
  ACCESS_SECRET_KEY: pgdrill-local-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: pgdrill-cnpg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: ACCESS_SECRET_KEY
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: pgdrill-cnpg
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: pgdrill-cnpg
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
            - |
              until mc alias set local http://minio:9000 "$ACCESS_KEY_ID" "$ACCESS_SECRET_KEY"; do
                sleep 2
              done
              mc mb --ignore-existing local/backups
          env:
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: ACCESS_KEY_ID
            - name: ACCESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: ACCESS_SECRET_KEY
